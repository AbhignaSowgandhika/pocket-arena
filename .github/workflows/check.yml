# Runs automatically on every push: plays matches with no window and saves
# screenshots, so we know the game still works. Results: the "Actions" tab.
name: check-game

on:
  push:
  workflow_dispatch:

permissions:
  contents: write     # lets the job save screenshots to the "screenshots" branch

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pygame
        run: pip install -r requirements.txt
      - name: Simulate 4 matches (rules only)
        run: python tools/simulate.py 4
      - name: Play a match and take screenshots
        run: python tools/screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
      - name: Save screenshots to the "screenshots" branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd screenshots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          printf "# Screenshots\n\nTaken automatically from commit ${GITHUB_SHA::7}.\n\n" > README.md
          for f in *.png; do printf "### $f\n![$f]($f)\n\n" >> README.md; done
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
